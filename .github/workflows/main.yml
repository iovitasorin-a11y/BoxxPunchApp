name: Build BoxxPunch iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS app
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -type d | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Nu am gasit niciun fisier .xcodeproj"
            exit 1
          fi

          echo "Proiect gasit: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme BoxxPunchApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean build
