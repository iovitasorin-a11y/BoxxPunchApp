name: Build BoxxPunch iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Find Xcode project
        run: |
          echo "=== Files ==="
          find . -maxdepth 4 -type d -name "*.xcodeproj" -print

      - name: Build iOS app
        run: |
          PROJECT=$(find . -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Nu exista niciun fisier .xcodeproj"
            exit 1
          fi

          echo "Project: $PROJECT"

          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c \
          'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
